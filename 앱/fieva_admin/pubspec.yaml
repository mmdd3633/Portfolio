name: fieva_admin
description: "Fieva Admin - 화재 감지 점검 관리자 앱"
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ">=3.10.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3

  # BLE / iBeacon
  flutter_beacon: ^0.5.1
  permission_handler: ^11.3.1

  # 음성 안내
  flutter_tts: ^4.2.0

  # 상태 관리 / 유틸
  provider: ^6.1.2
  vector_math: ^2.1.4

  # 센서 (보폭/방향 보조)
  sensors_plus: ^6.0.1

  # 파일/네트워크
  http: ^1.2.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

dependency_overrides:
  flutter_beacon:
    path: third_party/flutter_beacon
